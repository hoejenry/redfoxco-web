server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # WASM MIME type
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # Cache static assets aggressively (trunk adds content hashes to filenames)
    location ~* \.(wasm|js|css|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — always serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
