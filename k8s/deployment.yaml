apiVersion: apps/v1
kind: Deployment
metadata:
  name: redfoxco-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redfoxco-web
  template:
    metadata:
      labels:
        app: redfoxco-web
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: redfoxco-web
        image: ghcr.io/hoejenry/redfoxco-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
