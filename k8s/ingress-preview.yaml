apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redfoxco-web-preview-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - preview.redfoxcohomes.com
    secretName: redfoxco-web-preview-tls
  rules:
  - host: preview.redfoxcohomes.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redfoxco-web
            port:
              number: 80
