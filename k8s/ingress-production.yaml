# Apply this file to cut over redfoxcohomes.com from WordPress to the WASM site.
# Before applying: delete the old wordpress-ingress with:
#   kubectl delete ingress wordpress-ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redfoxco-web-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - redfoxcohomes.com
    - www.redfoxcohomes.com
    secretName: redfoxco-web-tls
  rules:
  - host: redfoxcohomes.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redfoxco-web
            port:
              number: 80
  - host: www.redfoxcohomes.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redfoxco-web
            port:
              number: 80
